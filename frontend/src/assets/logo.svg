<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular aura -->
  <circle cx="250" cy="250" r="220" fill="#0f172a" stroke="url(#sunGlow)" stroke-width="4" opacity="0.85" />
  
  <!-- Radiating sun rays -->
  <g stroke="url(#sunGlow)" stroke-width="3" opacity="0.6">
    <line x1="250" y1="50" x2="250" y2="90" stroke-linecap="round" />
    <line x1="391" y1="108" x2="363" y2="136" stroke-linecap="round" />
    <line x1="450" y1="250" x2="410" y2="250" stroke-linecap="round" />
    <line x1="108" y1="108" x2="136" y2="136" stroke-linecap="round" />
    <line x1="50" y1="250" x2="90" y2="250" stroke-linecap="round" />
  </g>

  <!-- Golden Rising Sun half circle -->
  <path d="M 120 280 A 130 130 0 0 1 380 280 Z" fill="url(#sunGlow)" filter="url(#glow)" opacity="0.9" />

  <!-- Digital Circuit Lines -->
  <path d="M 150 280 L 190 340 L 250 340 L 310 340 L 350 280" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <circle cx="190" cy="340" r="6" fill="#38bdf8" />
  <circle cx="250" cy="340" r="8" fill="#34d399" />
  <circle cx="310" cy="340" r="6" fill="#38bdf8" />

  <!-- Golden Grain Stalk & Balanced Distribution Scales -->
  <!-- Left Pan -->
  <line x1="180" y1="200" x2="180" y2="230" stroke="#f8fafc" stroke-width="3" />
  <path d="M 150 230 Q 180 250 210 230 Z" fill="url(#emeraldGrad)" />

  <!-- Right Pan -->
  <line x1="320" y1="200" x2="320" y2="230" stroke="#f8fafc" stroke-width="3" />
  <path d="M 290 230 Q 320 250 350 230 Z" fill="url(#emeraldGrad)" />

  <!-- Scale Beam & Center Pillar -->
  <line x1="170" y1="200" x2="330" y2="200" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
  <polygon points="250,170 240,280 260,280" fill="#f8fafc" />
  <circle cx="250" cy="180" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />

  <!-- Central Wheat Grain Emblem -->
  <path d="M 250 130 Q 265 155 250 180 Q 235 155 250 130 Z" fill="#fef08a" />
  <path d="M 235 145 Q 242 165 230 185 Q 220 165 235 145 Z" fill="#fef08a" />
  <path d="M 265 145 Q 258 165 270 185 Q 280 165 265 145 Z" fill="#fef08a" />

  <!-- Brand Typography Arc -->
  <text x="250" y="410" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    SMART RATION
  </text>
  <text x="250" y="440" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    PUBLIC DISTRIBUTION SYSTEM
  </text>
</svg>
